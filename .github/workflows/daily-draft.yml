
name: Generate daily Short draft

on:
  schedule:
    # 5:30 PM IST = 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Generate video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_TOPIC: ${{ vars.CHANNEL_TOPIC }}
          VIDEO_LANGUAGE: ${{ vars.VIDEO_LANGUAGE }}
          VIDEO_DURATION: ${{ vars.VIDEO_DURATION }}
        run: python main.py

      - name: Save video draft
        uses: actions/upload-artifact@v4
        with:
          name: daily-short-review
          path: output/
          retention-days: 3
